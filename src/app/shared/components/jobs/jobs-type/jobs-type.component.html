<app-section-header [title]="'Job Type'"></app-section-header>

<div class="row modal-body h-100">
  <div class="col-xl-12">
    
    <div class="text-center py-4" *ngIf="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted">Loading job types...</p>
    </div>

    <div class="alert alert-danger d-flex align-items-center" *ngIf="error && !loading">
      <i class="ri-error-warning-line me-2"></i>
      <div class="flex-grow-1">{{ error }}</div>
      <button class="btn btn-outline-danger btn-sm">
        <i class="ri-refresh-line me-1"></i>
        Retry
      </button>
    </div>

    <div *ngIf="!loading && !error">

      <div class="table-responsive">
        <table class="table table-hover table-striped">
          <thead class="table-light">
            <tr>
              <th scope="col" style="width: 50px;" *ngIf="allowSelection"></th>
              <th scope="col">Job Type Name</th>
              <th scope="col" *ngIf="showStatus">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let jobType of jobTypes; trackBy: trackByJobTypeId" 
                [class]="getJobTypeRowClass(jobType)"
                [style.opacity]="jobType.isArchived ? '0.6' : '1'">
              
              <td *ngIf="allowSelection">
                <div class="form-check">
                  <input class="form-check-input" 
                         type="checkbox" 
                         [checked]="jobType.isSelected"
                         [disabled]="jobType.isArchived"
                         (change)="toggleJobTypeSelection(jobType)"
                         [id]="'jobType_' + jobType.id">
                  <label class="form-check-label" [for]="'jobType_' + jobType.id"></label>
                </div>
              </td>
              
              <td>
                <div class="d-flex align-items-center">
                  <i class="ri-briefcase-line me-2 text-secondary"></i>
                  <span class="fw-medium">{{ jobType.name }}</span>
                </div>
              </td>
              <td *ngIf="showStatus">
                <span [class]="getJobTypeStatusClass(jobType)">
                  {{ getJobTypeStatus(jobType) }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
        <div>
            Showing {{jobTypes.length}} entries
        </div>
      </div>

      <div class="text-center py-5" *ngIf="jobTypes.length === 0">
        <div class="mb-3">
          <i class="ri-briefcase-line display-4 text-muted"></i>
        </div>
        <h6 class="text-muted">No Job Types Found</h6>
        <p class="text-muted small mb-3">No job types are available.</p>
        <button class="btn btn-outline-primary btn-sm">
          <i class="ri-refresh-line me-1"></i>
          Refresh
        </button>
      </div>
    </div>
  </div>
</div>
