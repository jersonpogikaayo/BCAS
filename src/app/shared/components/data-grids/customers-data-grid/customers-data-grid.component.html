<div class="table-container h-100">
    <div class="table-responsive">
        <table class="table table-gridjs">
            <thead class="table-light">
                <tr>
                    <!-- Existing columns -->
                    <th *ngFor="let col of visibleColumns" 
                        class="sort column-header" 
                        [attr.data-sort]="col.technicalName"
                        [style.width]="getColumnWidth(col.technicalName)"
                        [style.min-width]="getColumnMinWidth(col.technicalName)"
                        [style.text-align]="col.technicalName === 'actions' ? 'center' : 'left'">
                        <div class="d-flex flex-column" 
                             [class.align-items-center]="col.technicalName === 'actions'"
                             [class.align-items-start]="col.technicalName !== 'actions'">
                            <span class="column-title" 
                                  [title]="col.prettyName"
                                  placement="top"
                                  ngbTooltip="{{ col.prettyName }}"
                                  *ngIf="col.technicalName !== 'actions'">
                                {{ col.prettyName }}
                            </span>
                            
                            <!-- Regular search input for non-action columns -->
                            <input 
                                type="text" 
                                class="form-control form-control-sm mt-2" 
                                placeholder="Search..."
                                (input)="onSearch($event, col.technicalName)"
                                [value]="searchFilters[col.technicalName] || ''"
                                *ngIf="col.technicalName !== 'actions' && withFilter"
                            >
                            <ng-container *ngIf="col.technicalName === 'actions'">
                                <!-- <button type="button" class="btn btn-primary btn-md" (click)="handleAction('add new customer', null)">
                                    Add New
                                </button> -->

                                <div class="btn-group dropdown-left-force" ngbDropdown>
                                    <button type="button" 
                                            class="btn btn-primary btn-md dropdown-toggle"
                                            ngbDropdownToggle>
                                        Action
                                    </button>
                                    <div class="dropdown-menu dropdownmenu-primary" ngbDropdownMenu>
                                        <a class="dropdown-item" 
                                           style="cursor: pointer;"
                                           (click)="handleAction('add new customer', null)">
                                            Create New Customer
                                        </a>
                                        <a class="dropdown-item" 
                                           style="cursor: pointer;"
                                           (click)="handleAction('upload from csv', null)">
                                            Upload from CSV
                                        </a>
                                    </div>
                                </div>
                            </ng-container>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <!-- Loading placeholder -->
                <tr *ngIf="loading">
                    <td *ngFor="let col of visibleColumns" [style.width]="getColumnWidth(col.technicalName)">
                        <span class="placeholder col-6"></span>
                    </td>
                </tr>

                <!-- Data rows -->
                <ng-container *ngIf="!loading">
                    <tr *ngFor="let item of gridItems" >
                        <!-- Existing columns -->
                        <td *ngFor="let col of visibleColumns" 
                            [style.width]="getColumnWidth(col.technicalName)"
                            [style.text-align]="col.technicalName === 'actions' ? 'center' : 'left'">
                            <ng-container *ngIf="col.technicalName !== 'actions'; else actionsTemplate">
                                <span class="cell-content"
                                      [title]="item[col.technicalName] | columnFormat:col.technicalName"
                                      placement="top"
                                      ngbTooltip="{{ item[col.technicalName] | columnFormat:col.technicalName }}">
                                      <ng-container *ngIf="item.childCustomerCount !== null && item.childCustomerCount > 0; else childCustomerCountTemplate">
                                          <a style="cursor: pointer;" href="javascript:void(0);" (click)="handleAction('view child', item)">{{ item[col.technicalName] | columnFormat:col.technicalName }}</a>
                                      </ng-container>
                                      <ng-template #childCustomerCountTemplate>
                                          {{ item[col.technicalName] | columnFormat:col.technicalName }}
                                      </ng-template>
                                </span>
                            </ng-container>

                            <!-- Individual Actions template -->
                            <ng-template #actionsTemplate>
                                <div class="btn-group dropdown-left-force" ngbDropdown>
                                    <button type="button" 
                                            class="btn btn-primary btn-sm dropdown-toggle"
                                            ngbDropdownToggle>
                                        Action
                                    </button>
                                    <div class="dropdown-menu dropdownmenu-primary" ngbDropdownMenu>
                                        <a class="dropdown-item" 
                                           style="cursor: pointer;"
                                           (click)="handleAction('edit', item)">
                                            Edit Customer
                                        </a>
                                        <a class="dropdown-item" 
                                           style="cursor: pointer;"
                                           (click)="handleAction('delete', item)">
                                            Delete Customer
                                        </a>
                                    </div>
                                </div>
                            </ng-template>
                            
                        </td>
                    </tr>
                </ng-container>
                
                <!-- No data message -->
                <tr *ngIf="!loading && gridItems.length === 0">
                    <td [attr.colspan]="visibleColumns.length + 1" class="text-center py-4">
                        Search returned no results
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Rest of pagination code -->
    <div class="row justify-content-md-between align-items-md-center paging">
        <div class="col col-sm-6" *ngIf="totalItems != 0">
            <div class="dataTables_info mb-2" id="tickets-table_info" role="status" aria-live="polite">
                Showing 
                <select [(ngModel)]="customPageSize" 
                        (ngModelChange)="onPageSizeChange()"
                        class="form-select d-inline-block mx-1"
                        style="width: auto;">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="custom">Custom</option>
                </select>
                rows of {{ totalItems }} entries
            </div>
            
            <div *ngIf="customPageSize === 'custom'">
                <input type="number" 
                       [(ngModel)]="pageSize" 
                       (ngModelChange)="onPageSizeChange()"
                       class="form-control d-inline-block"
                       style="width: 100px;"
                       min="1"
                       max="1000"
                       placeholder="Custom">
            </div>
        </div>
        
        <div class="col col-sm-6">
            <div class="text-sm-right float-sm-end listjs-pagination" 
                 [ngStyle]="{ 'display': totalItems === 0 ? 'none' : 'block' }">
                <ngb-pagination 
                    class="pagination" 
                    (pageChange)="onPageChange($event)" 
                    [collectionSize]="totalItems" 
                    [(page)]="currentPage" 
                    [pageSize]="pageSize" 
                    [maxSize]="5" 
                    [rotate]="true" 
                    [boundaryLinks]="true">
                </ngb-pagination>
            </div>
        </div>
    </div>
</div>
