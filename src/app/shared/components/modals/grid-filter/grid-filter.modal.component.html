<div class="modal-header bg-light p-3">
    <h5 class="modal-title" id="exampleModalLabel">Add Column</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="close()"></button>
</div>
<form>
    <div class="modal-body">
        <div class="form-check mb-3">
            <input 
                type="checkbox" 
                class="form-check-input" 
                [checked]="allSelected"
                (change)="toggleSelectAll($event)">
            <label class="form-check-label">Select All</label>
        </div>

        <div *ngFor="let col of availableColumns" class="form-check">
            <input 
                type="checkbox" 
                class="form-check-input" 
                [checked]="col.visible"
                (change)="toggleSelection(col.technicalName)">
            <label class="form-check-label">{{ col.prettyName }}</label>
        </div>
    </div>
    <div class="modal-footer">
        <div class="hstack gap-2 justify-content-end">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="close()">Close</button>
            <button type="submit" class="btn btn-success" id="add-btn" (click)="save()">Save</button>
        </div>
    </div>
</form>
