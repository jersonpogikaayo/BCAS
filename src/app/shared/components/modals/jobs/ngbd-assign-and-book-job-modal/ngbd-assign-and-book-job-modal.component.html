<!-- ngbd-assign-and-book-job-modal.component.html -->
<div class="modal-content">
    <div class="modal-header bg-light p-3">
        <h5 class="modal-title" id="assignBookModalLabel" *ngIf="type == 'assign'">Assign Job</h5>
        <h5 class="modal-title" id="assignBookModalLabel" *ngIf="type == 'book'">Book Job</h5>
        <h5 class="modal-title" id="assignBookModalLabel" *ngIf="type == 'assignAndBook'">Assign and Book Job</h5>
        <h5 class="modal-title" id="assignBookModalLabel" *ngIf="type == 'reAssign' || type == 'reAssignPaused'">Reassign Job</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="close(false)"></button>
    </div>
    
    <div class="modal-body">
        <!-- User Selection Table (shown for all types except 'book') -->
        <table class="table table-nowrap" *ngIf="type != 'book'">
            <thead>
                <tr>
                    <th scope="col"></th>
                    <th scope="col">First Name</th>
                    <th scope="col">Last Name</th>
                    <th scope="col">Email</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <th scope="row">
                        <div class="form-check">
                            <input class="form-check-input" 
                                   type="checkbox" 
                                   name="checkAll" 
                                   [value]="user" 
                                   (change)="checkUncheckData($event, user)" 
                                   [checked]="selectedUserId[0] == user.id">
                        </div>
                    </th>
                    <td>{{ user.firstName }}</td>
                    <td>{{ user.lastName }}</td>
                    <td>{{ user.email }}</td>
                </tr>
            </tbody>
        </table>
        
        <!-- Date and Time Selection (shown for all types except 'reAssignPaused') -->
        <div class="row mb-3" *ngIf="type !== 'reAssignPaused'">
            <div class="col-lg-12 user-form-label text-align-right">
                <label for="booked-date-field" class="form-label">Select a Date and Time to book the Job to:</label>
            </div>
            <div class="col-lg-12">
                <input class="form-control flatpickr-input" 
                       id="booked-date-field"
                       [(ngModel)]="bookedDate" 
                       type="text" 
                       mwlFlatpickr 
                       [altInput]="false" 
                       [enableTime]="true" 
                       [convertModelValue]="true" 
                       [dateFormat]="'d-m-Y H:i'"
                       placeholder="Select date and time">
            </div>
        </div>
    </div>
    
    <div class="modal-footer">
        <div class="hstack gap-2 justify-content-end">
            <button type="button" 
                    class="btn btn-light" 
                    data-bs-dismiss="modal" 
                    (click)="close(false)">
                Cancel
            </button>
            
            <!-- Assign Job Button (for non-book types) -->
            <button type="submit" 
                    class="btn btn-primary" 
                    id="assign-btn" 
                    (click)="submit()" 
                    [disabled]="isLoading"
                    *ngIf="type != 'book'">
                <span class="flex-grow-1 me-2">
                    <span *ngIf="type == 'assign'">Assign Job</span>
                    <span *ngIf="type == 'assignAndBook'">Assign and Book Job</span>
                    <span *ngIf="type == 'reAssign' || type == 'reAssignPaused'">Reassign Job</span>
                </span>
                <span class="spinner-border spinner-border-sm flex-shrink-0" 
                      role="status" 
                      *ngIf="isLoading">
                    <span class="visually-hidden">Loading...</span>
                </span>
            </button>
            
            <!-- Book Job Button (for book type only) -->
            <button type="submit" 
                    class="btn btn-primary" 
                    id="book-btn" 
                    (click)="submit()" 
                    [disabled]="isLoading"
                    *ngIf="type == 'book'">
                <span class="flex-grow-1 me-2">
                    Book Job
                </span>
                <span class="spinner-border spinner-border-sm flex-shrink-0" 
                      role="status" 
                      *ngIf="isLoading">
                    <span class="visually-hidden">Loading...</span>
                </span>
            </button>
        </div>
    </div>
</div>
