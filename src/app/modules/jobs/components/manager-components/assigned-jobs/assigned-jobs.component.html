<app-common-datagrid
    [gridItems]="gridItems"
    [loading]="loading"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [columnHeader]="columnHeader"
    [isEngineer]="false"
    (searchData)="onSearch($event)"
    (pageChanged)="onPageChanged($event)"
    (pageSizeChanged)="onPageSizeChanged($event)"
    (actionSelected)="onActionSelected($event)"
    (bulkActionSelected)="onBulkActionSelected($event)"
    (filterPopupRequested)="onFilterPopupRequested()"
    (columnArrangementRequested)="showColumnArrangementPopup()"
    >
</app-common-datagrid>
