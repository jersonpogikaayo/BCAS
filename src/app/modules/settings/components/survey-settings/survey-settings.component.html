<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
            </div>
            <div class="card-body">
                <app-survey-data-grid
                    [gridItems]="gridItems"
                    [loading]="loading"
                    [totalItems]="totalItems"
                    [currentPage]="currentPage"
                    [pageSize]="pageSize"
                    [columnHeader]="columnHeader"
                    (searchData)="onSearch($event)"
                    (pageChanged)="onPageChanged($event)"
                    (pageSizeChanged)="onPageSizeChanged($event)"
                    (actionSelected)="handleAction($event.action, $event.item)">
                </app-survey-data-grid>
            </div>  
        </div>
    </div>
</div>
