<div class="auth-page-wrapper pt-5">
    <!-- auth page bg -->
    <div class="auth-one-bg-position auth-one-bg" id="auth-particles">
        <div class="bg-overlay"></div>
        <div class="shape">
            <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 120">
                <path d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
            </svg>
        </div>
    </div>

    <!-- auth page content -->
    <div class="auth-page-content">
        <div class="container">
            <!-- Logo Section -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="text-center mt-sm-5 mb-4 text-white-50">
                        <img src="../../../assets/logo.JPG" alt="AIDental Logo" />
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-6">
                    <div class="card mt-4">
                        <div class="card-body p-4">
                            <!-- Header -->
                            <div class="text-center mt-2">
                                <h5 class="text-primary">Welcome Back!</h5>
                                <p class="text-muted">Sign in to continue.</p>
                            </div>

                            <!-- Form -->
                            <div class="p-2 mt-4">
                                <!-- Error Alert -->
                                <div class="alert alert-danger" role="alert" *ngIf="error">
                                    {{ error }}
                                </div>

                                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                                    <!-- Email Field -->
                                    <div class="mb-3">
                                        <label class="form-label" for="userName">Email</label>
                                        <input 
                                            type="email" 
                                            class="form-control" 
                                            id="userName" 
                                            formControlName="userName" 
                                            [class.is-invalid]="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched">
                                        <div *ngIf="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched" class="invalid-feedback">
                                            <div *ngIf="loginForm.get('userName')?.errors?.['required']">Email is required</div>
                                            <div *ngIf="loginForm.get('userName')?.errors?.['email']">Please enter a valid email address</div>
                                        </div>
                                    </div>

                                    <!-- Password Field -->
                                    <div class="mb-3">
                                        <label class="form-label" for="password">Password</label>
                                        <div class="position-relative auth-pass-inputgroup mb-3">
                                            <input 
                                                [type]="showPassword ? 'text' : 'password'" 
                                                class="form-control pe-5" 
                                                id="password" 
                                                formControlName="password" 
                                                [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                                            <button 
                                                class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted" 
                                                type="button" 
                                                (click)="togglePasswordVisibility()">
                                                <i class="mdi align-middle" 
                                                   [class.mdi-eye-off-outline]="!showPassword" 
                                                   [class.mdi-eye-outline]="showPassword"></i>
                                            </button>
                                            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
                                                <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
                                            </div>
                                        </div>
                                        <div class="float-end">
                                            <a routerLink="/auth/forgot-password" class="text-muted">Forgot password?</a>
                                        </div>
                                    </div>

                                    <!-- Remember Me -->
                                    <div class="form-check">
                                        <input 
                                            class="form-check-input" 
                                            type="checkbox" 
                                            id="rememberMe" 
                                            formControlName="rememberMe">
                                        <label class="form-check-label" for="rememberMe">Remember me</label>
                                    </div>

                                    <!-- Submit Button -->
                                    <div class="mt-4">
                                        <button 
                                            class="btn btn-primary w-100" 
                                            type="submit" 
                                            [disabled]="!loginForm.valid || loading">
                                            <span class="d-flex align-items-center">
                                                <span class="flex-grow-1 me-2">Sign In</span>
                                                <span class="spinner-border spinner-border-sm flex-shrink-0" role="status" *ngIf="loading">
                                                    <span class="visually-hidden">Loading...</span>
                                                </span>
                                            </span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Sign Up Link (if needed) -->
                    <div class="mt-4 text-center">
                        <p class="mb-0">Don't have an account? 
                            <a routerLink="/auth/register" class="fw-semibold text-primary text-decoration-underline">Sign up</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="text-center">
                        <p class="mb-0 text-muted">© 2025 AIDental. All rights reserved.</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</div>
