<header id="page-topbar">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a href="" class="logo logo-dark">
                        <span class="logo-sm">
                            <h4>BCAS BIOMED</h4>
                        </span>
                        <span class="logo-lg">
                            <h4>BCAS BIOMED</h4>
                        </span>
                    </a>

                    <a href="" class="logo logo-light">
                        <span class="logo-sm">
                            <h4>BCAS BIOMED</h4>
                        </span>
                        <span class="logo-lg">
                            <h4>BCAS BIOMED</h4>
                        </span>
                    </a>
                </div>

                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger" id="topnav-hamburger-icon" (click)="toggleMobileMenu($event)">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>

            <div class="d-flex align-items-center">
                <div class="dropdown ms-sm-3 header-item topbar-user" ngbDropdown>
                    <button type="button" class="btn" id="page-header-user-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" ngbDropdownToggle>
                        <span class="d-flex align-items-center">
                            <span class="text-start ms-xl-2" *ngIf="currentUser">
                                <span class="d-none ms-1 fw-small user-name-text">{{currentUser.email}}</span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu autoClose="'false'">
                        <!-- item-->
                        <a class="dropdown-item">
                            <!-- <i class="mdi mdi-lifebuoy text-muted fs-16 align-middle me-1"></i>  -->
                            Work Offline
                            <span class="align-middle">
                                <div class="form-check form-switch form-check-right"  *ngIf="debugSettingsData.length !== 0">
                                    <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckCheckedDisabled" [checked]="debugSettingsData[0]?.workOffline">
                                </div>
                            </span>
                        </a>
                        <a class="dropdown-item" [routerLink]="'/pages/queue-lists'">
                            <i class="mdi mdi-list-status text-muted fs-16 align-middle me-1"></i> 
                            <span class="align-middle" data-key="t-logout">API Queue</span>
                        </a>
                        
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="javascript: void(0);" (click)="logout()">
                            <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i> 
                            <span class="align-middle" data-key="t-logout">Logout</span>
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</header>
